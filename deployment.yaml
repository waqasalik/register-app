apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-app-deployment
  labels:
    app: accounting-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounting-app
  template:
    metadata:
      labels:
        app: accounting-app
    spec:
      containers:
        - name: accounting-app
          image: waqaszai/accounting-app:63
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
